<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="佘杰的个人网站 - 7年前端开发经验，Vue 专家，专注于构建高性能、可维护的前端应用" />
  <meta name="keywords" content="佘杰,前端开发,Vue.js,TypeScript,JavaScript,Web开发" />
  <meta name="author" content="佘杰" />
  <meta name="robots" content="index,follow" />

  <!-- Open Graph -->
  <meta property="og:title" content="佘杰 - 前端开发工程师" />
  <meta property="og:description" content="7年前端开发经验，Vue 专家，专注于构建高性能、可维护的前端应用" />
  <meta property="og:type" content="website" />

  <!-- RSS Feed -->
  <link rel="alternate" type="application/rss+xml" title="佘杰 - 前端开发工程师" href="/rss.xml" />

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/images/avatar.svg" />
  <link rel="apple-touch-icon" href="/images/avatar.svg" />

  <!-- Preconnect to external domains - 使用国内 CDN 镜像 -->
  <link rel="preconnect" href="https://fonts.loli.net" />
  <link rel="preconnect" href="https://gstatic.loli.net" crossorigin />

  <!-- Google Fonts - 非阻塞加载：media=print + onload 切换，避免CSS阻塞渲染 -->
  <link
    href="https://fonts.loli.net/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet" media="print" onload="this.media='all'" />
  <noscript>
    <link
      href="https://fonts.loli.net/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet" />
  </noscript>

  <!-- DNS Prefetch for potential API endpoints -->
  <link rel="dns-prefetch" href="https://fonts.loli.net" />
  <link rel="dns-prefetch" href="https://gstatic.loli.net" />

  <title>佘杰 - 前端开发工程师</title>
</head>

<body>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
