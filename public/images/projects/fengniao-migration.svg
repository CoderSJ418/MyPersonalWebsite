<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">蜂鸟生活 H5 到微信小程序迁移</title>
  <desc id="desc">跨端迁移覆盖登录、扫码、分享和主包优化</desc>
  <rect width="1200" height="675" rx="48" fill="#F8FAFC"/>
  <circle cx="180" cy="560" r="220" fill="#DBEAFE"/>
  <circle cx="1080" cy="80" r="210" fill="#E0E7FF"/>
  <text x="88" y="112" fill="#1E3A8A" font-family="sans-serif" font-size="28" font-weight="700">FENGNIAO · CROSS-PLATFORM MIGRATION</text>
  <text x="88" y="164" fill="#475569" font-family="sans-serif" font-size="22">H5 → 微信小程序 · 双端交付</text>
  <g font-family="sans-serif" text-anchor="middle">
    <rect x="92" y="245" width="260" height="170" rx="34" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/>
    <text x="222" y="320" fill="#1E40AF" font-size="34" font-weight="700">H5</text>
    <text x="222" y="365" fill="#64748B" font-size="18">既有商城</text>
    <rect x="848" y="245" width="260" height="170" rx="34" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/>
    <text x="978" y="315" fill="#1E40AF" font-size="28" font-weight="700">微信小程序</text>
    <text x="978" y="365" fill="#64748B" font-size="18">交付版本</text>
    <rect x="430" y="210" width="340" height="240" rx="40" fill="#2563EB"/>
    <text x="600" y="275" fill="#FFFFFF" font-size="27" font-weight="700">迁移验证链路</text>
    <text x="600" y="325" fill="#DBEAFE" font-size="19">授权登录 · Scene 扫码</text>
    <text x="600" y="363" fill="#DBEAFE" font-size="19">PID 分享 · 路由适配</text>
    <text x="600" y="408" fill="#FFFFFF" font-size="24" font-weight="700">4.06MB → 1.75MB</text>
  </g>
  <path d="M352 330h78M770 330h78" stroke="#2563EB" stroke-width="5" stroke-linecap="round"/>
</svg>
